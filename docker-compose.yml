x-backend-env: &backend-env
  ENVIRONMENT: ${ENVIRONMENT:-production}
  DEBUG: ${DEBUG:-false}
  LOG_LEVEL: ${LOG_LEVEL:-INFO}
  CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost}
  LLM_PROVIDER: ${LLM_PROVIDER:-nvidia}
  NVIDIA_API_KEY: ${NVIDIA_API_KEY}
  NVIDIA_BASE_URL: ${NVIDIA_BASE_URL:-https://integrate.api.nvidia.com/v1}
  NVIDIA_MODEL: ${NVIDIA_MODEL:-meta/llama-3.1-70b-instruct}
  MAX_CONTEXT_MESSAGES: ${MAX_CONTEXT_MESSAGES:-20}
  MAX_CONTEXT_TOKENS: ${MAX_CONTEXT_TOKENS:-6000}
  LLM_TEMPERATURE: ${LLM_TEMPERATURE:-0.7}
  LLM_MAX_OUTPUT_TOKENS: ${LLM_MAX_OUTPUT_TOKENS:-2048}
  DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-paro}:${POSTGRES_PASSWORD:-paro}@postgres:5432/${POSTGRES_DB:-paro}
  REDIS_URL: redis://redis:6379/0
  REQUEST_MAX_BODY_BYTES: ${REQUEST_MAX_BODY_BYTES:-1000000}
  RATE_LIMIT_PER_MINUTE: ${RATE_LIMIT_PER_MINUTE:-60}

services:
  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-paro}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-paro}
      POSTGRES_DB: ${POSTGRES_DB:-paro}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-paro} -d ${POSTGRES_DB:-paro}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - paro-net

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - paro-net

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      <<: *backend-env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - paro-net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost}
    restart: unless-stopped
    depends_on:
      - backend
    networks:
      - paro-net

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-80}:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - backend
      - frontend
    networks:
      - paro-net

networks:
  paro-net:
    driver: bridge

volumes:
  postgres_data:
