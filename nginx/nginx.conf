worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    sendfile      on;

    # Basic access/error logging to stdout/stderr so `docker compose logs` works.
    access_log /dev/stdout;
    error_log  /dev/stderr warn;

    # Reasonable client body cap; matches the backend's own REQUEST_MAX_BODY_BYTES.
    client_max_body_size 1m;

    upstream backend_upstream {
        server backend:8000;
    }

    upstream frontend_upstream {
        server frontend:3000;
    }

    server {
        listen 80;
        server_name _;

        # Secure headers.
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-XSS-Protection "1; mode=block" always;
        # Uncomment once served over HTTPS:
        # add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;

        # ---- Streaming chat endpoint: no buffering, long read timeout ----
        location /api/chat {
            proxy_pass http://backend_upstream;
            proxy_http_version 1.1;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Critical for SSE: disable all buffering so tokens reach the
            # client as soon as FastAPI writes them, and don't let the
            # connection get closed mid-stream by a short timeout.
            proxy_buffering off;
            proxy_cache off;
            proxy_request_buffering off;
            chunked_transfer_encoding on;
            proxy_read_timeout 300s;
            proxy_send_timeout 300s;
        }

        # ---- Rest of the API ----
        location /api/ {
            proxy_pass http://backend_upstream;
            proxy_http_version 1.1;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_read_timeout 60s;
        }

        # ---- Next.js frontend ----
        location / {
            proxy_pass http://frontend_upstream;
            proxy_http_version 1.1;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Support Next.js dev/HMR websocket upgrades if this config is
            # ever pointed at the dev server.
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }
    }
}
